services:
  api:
    build:
      target: development
    volumes:
      - ./qa-services/app:/app/app:ro
    command:
      - sh
      - -c
      - python -m app.core.migrations && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build:
      target: development
    environment:
      VITE_API_BASE_URL: /api
      VITE_API_PROXY_TARGET: http://api:8000
    volumes:
      - ./qa-application/src:/app/src:ro
      - ./qa-application/public:/app/public:ro
      - ./qa-application/index.html:/app/index.html:ro
      - ./qa-application/vite.config.ts:/app/vite.config.ts:ro
      - ./qa-application/tailwind.config.cjs:/app/tailwind.config.cjs:ro
      - ./qa-application/postcss.config.cjs:/app/postcss.config.cjs:ro
    command: [npm, run, dev, --, --host, 0.0.0.0]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:5173').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))

  worker:
    build:
      target: development
    volumes:
      - ./qa-services/app:/app/app:ro
