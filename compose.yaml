name: qa-method

services:
  api:
    build:
      context: ./qa-services
      target: runtime
    init: true
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://qa_method:qa_method_local@database:5432/qa_method}
      QA_DEFAULT_MODE: demo
      QA_CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      QA_GEMINI_MODEL: ${QA_GEMINI_MODEL:-gemini-3.5-flash-lite}
      QA_JUDGE_GEMINI_MODEL: ${QA_JUDGE_GEMINI_MODEL:-}
      QA_ALLOWED_GEMINI_MODELS: ${QA_ALLOWED_GEMINI_MODELS:-gemini-3.5-flash-lite}
      QA_VECTOR_SEARCH_ENABLED: ${QA_VECTOR_SEARCH_ENABLED:-false}
      QA_EMBEDDING_CACHE_DIR: /var/lib/qa-method/embeddings
      HF_HOME: /var/lib/qa-method/embeddings/huggingface
      XDG_CACHE_HOME: /var/lib/qa-method/embeddings/cache
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_FALLBACK_API_KEY: ${GEMINI_FALLBACK_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    depends_on:
      database:
        condition: service_healthy
    command:
      - sh
      - -c
      - python -m app.core.migrations && exec uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:${QA_API_PORT:-8000}:8000"
    volumes:
      - embedding_cache:/var/lib/qa-method/embeddings
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  web:
    build:
      context: ./qa-application
      target: runtime
      args:
        VITE_API_BASE_URL: /api
    init: true
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:5173"
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1:5173/healthz]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  worker:
    build:
      context: ./qa-services
      target: runtime
    init: true
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://qa_method:qa_method_local@database:5432/qa_method}
      QA_GEMINI_MODEL: ${QA_GEMINI_MODEL:-gemini-3.5-flash-lite}
      QA_JUDGE_GEMINI_MODEL: ${QA_JUDGE_GEMINI_MODEL:-}
      QA_ALLOWED_GEMINI_MODELS: ${QA_ALLOWED_GEMINI_MODELS:-gemini-3.5-flash-lite}
      QA_VECTOR_SEARCH_ENABLED: ${QA_VECTOR_SEARCH_ENABLED:-false}
      QA_EMBEDDING_CACHE_DIR: /var/lib/qa-method/embeddings
      HF_HOME: /var/lib/qa-method/embeddings/huggingface
      XDG_CACHE_HOME: /var/lib/qa-method/embeddings/cache
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_FALLBACK_API_KEY: ${GEMINI_FALLBACK_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    depends_on:
      database:
        condition: service_healthy
    command: [python, -m, app.worker]
    restart: unless-stopped
    volumes:
      - embedding_cache:/var/lib/qa-method/embeddings
    healthcheck:
      disable: true

  database:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    environment:
      POSTGRES_DB: qa_method
      POSTGRES_USER: qa_method
      POSTGRES_PASSWORD: qa_method_local
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U qa_method -d qa_method]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  backend-tests:
    profiles: [test]
    build:
      context: ./qa-services
      target: test
    init: true
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://qa_method:qa_method_local@database:5432/qa_method
      QA_DEFAULT_MODE: demo

  frontend-tests:
    profiles: [test]
    build:
      context: ./qa-application
      target: test
    init: true
    network_mode: none

  smoke-tests:
    profiles: [test]
    image: python:3.12.14-slim-bookworm
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
      worker:
        condition: service_started
    environment:
      QA_API_URL: http://api:8000
      QA_WEB_URL: http://web:5173
    volumes:
      - ./scripts/compose_smoke.py:/tests/compose_smoke.py:ro
    command: [python, /tests/compose_smoke.py]

volumes:
  postgres_data:
  embedding_cache:
